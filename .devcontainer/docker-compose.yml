networks:
  aegis-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: aegis-br0

services:
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - aegis-net
    environment:
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LITELLM_ENDPOINT=http://litellm:4000/v1
      - OLLAMA_ENDPOINT=http://ollama:11434
    depends_on:
      - ollama
      - litellm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    networks:
      - aegis-net
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    networks:
      - aegis-net
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
    command: >
      --model ollama/gemma2
      --port 4000
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ollama-data: